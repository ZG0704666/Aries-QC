<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>展览互动内容制作员 · EXHIBIT STUDIO</title><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/refinement.css"><link rel="stylesheet" href="assets/atelier.css"><link rel="stylesheet" href="assets/workspace-tools.css"></head>
<body>
<header class="topbar"><a class="brand" href="#live" aria-label="回到执行现场"><span class="orbit"></span><strong>展览互动内容制作员</strong><span class="brand-en">EXHIBIT<br>AI EMPLOYEE</span></a><button class="project-switch" data-action="project">光与声音探索展 <span>⌄</span></button><div class="top-actions"><span class="demo-label"><i></i>本地交互演示</span><button class="icon-btn light" data-action="help" aria-label="使用说明">?</button><span class="avatar">林</span><span class="user-name">林雨</span><button class="icon-btn light" data-action="settings" aria-label="工作区设置">⌄</button></div></header>
<div class="mobile-switch"><button data-action="mobile" data-value="chat">员工对话</button><button data-action="mobile" data-value="work" class="active">任务工作区</button></div>
<div class="app-shell">
<aside class="conversation" aria-label="数字员工对话">
<div class="employee-head"><span class="employee-mark"><span class="orbit"></span></span><div><h1>展览互动内容制作员</h1><p>负责整理、制作、校验与交付</p><span class="employee-state"><i></i>等待你的指令 <em>演示</em></span></div></div>
<div class="context-chips"><span>3 个展项</span><span>中文</span><span>亲子观众</span></div>
<div id="chat-log" class="chat-log" role="log" aria-live="polite"></div>
<div class="composer-wrap"><div class="session-note"><span class="status-dot amber"></span><span id="session-note">内容仅保存在本次会话 · 不发送到服务器</span></div><div id="attachment-preview" class="attachment-preview"></div><form id="chat-form" class="composer"><label class="sr-only" for="message">给数字员工发送消息</label><textarea id="message" rows="2" maxlength="4000" placeholder="补充资料，或告诉员工下一步怎么做…"></textarea><div class="composer-tools"><label class="attach-btn" title="导入纯文本资料"><span>＋</span><input id="text-file" type="file" accept=".txt,text/plain" hidden></label><span>仅使用项目授权资料</span><button type="submit" class="send" aria-label="发送消息">↑</button></div></form><p class="composer-caption">本地指令演示，不调用真实 AI · Shift + Enter 换行</p></div>
</aside>
<main class="workspace" aria-label="任务工作区"><nav id="workspace-tabs" class="workspace-tabs" aria-label="功能页面"></nav><div class="workspace-tools" aria-label="工作区布局工具"><div class="layout-tools"><button type="button" data-action="focus-work" aria-pressed="false">专注工作区</button><label class="width-control">对话宽度 <select id="chat-width" aria-label="对话栏宽度"><option value="28">28%</option><option value="33.3333" selected>33%</option><option value="38">38%</option></select></label></div><div class="disclosure-tools"><button type="button" data-action="expand-all">展开全部</button><button type="button" data-action="collapse-all">收起全部</button></div></div><div id="workspace-body" class="workspace-body"></div><footer class="work-footer"><span><span class="shield">✓</span> 原文保持不变 · 成果绑定内容版本</span><button class="text-button" data-action="events">查看事件记录 ↗</button></footer></main>
</div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="icon-btn" data-action="close-dialog" aria-label="关闭弹窗">×</button></div><div id="dialog-body"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="assets/app.js"></script>
</body></html>

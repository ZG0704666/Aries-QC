 'content-tab':el=>{state.contentTab=el.dataset.value;render();},
 'source':()=>{go('content');setTimeout(()=>{const p=$('#source-panel');if(p){p.classList.remove('source-highlight');void p.offsetWidth;p.classList.add('source-highlight');p.scrollIntoView({block:'nearest',behavior:'smooth'});}},80);},
 'remove-fact':()=>dialog('移除缺少条件的候选事实？',`<p>只移除候选内容中的速度描述，不删除或改写原始来源。修改后旧审核与测试失效。</p><div class="footer-actions">${act('close-dialog','取消')}${act('confirm-remove-fact','移除候选事实','danger')}</div>`),
 'confirm-remove-fact':()=>{state.sourceIssue=false;invalidate();log('移除EX02缺少适用条件的候选事实');$('#dialog').close();addMessage('assistant','已在本地移除该候选事实。新版本为'+version()+'，仍需要真实测试和人工审核。');render();toast('候选事实已移除，原文未改动');},
 'save-script':()=>{const editor=$('#script-editor');if(!editor)return;const text=editor.value.trim();if(!text){toast('讲解内容不能为空');return;}if(text===state.scripts[state.exhibit]){toast('内容没有变化');return;}state.scripts[state.exhibit]=text;invalidate();log('保存'+exhibitData[state.exhibit].id+'脚本 '+version());addMessage('assistant','讲解草稿已在本地更新为'+version()+'。之前的审核和示例测试显示已失效，需要重新核对。');render();toast('草稿已更新（本地会话）');},
 'load-tests':()=>{state.testsLoaded=true;log('载入6条示例测试记录，未运行真实服务');addMessage('assistant','已载入示例测试记录供查看界面：3通过、1待修订、1执行失败、1未运行。这不是实际测试，不会解除发布门禁。');render();},
 'test-filter':el=>{state.testFilter=el.dataset.value;render();},
 'test-select':el=>{state.selectedTest=el.dataset.value;render();},
 'run-tests':()=>{log('尝试真实测试：服务未接入，未执行');addMessage('assistant','测试没有执行：当前HTML包未连接问答服务。请接入真实API后再运行；我不会生成假通过结果。',[['load-tests','查看示例测试记录']]);toast('真实测试服务尚未接入');render();},
 'retry-tests':()=>handlers['run-tests'](),
 'reject':()=>{state.approved=false;state.reviewConfirmed=false;log('当前草稿被退回修订');addMessage('assistant','已记录本地退回修订。原始来源保持不变；修改后须重新测试与审核。');render();toast('已退回修订（本地）');},
 'device':el=>{state.device=el.dataset.value;render();},
 'voice-help':()=>dialog('语音接入边界',`<p>文本转语音：将已批准脚本送交官方Breeze接口。声音转文字：需要ASR服务。两者独立接入和测试。</p><p>实时链路需要麦克风、VAD、ASR、已发布来源约束问答、TTS与播放。取消会话后必须丢弃旧轮次音频。</p><div class="notice">此包仅实现前端界面与本地音频播放，不调用供应商接口、不使用浏览器语音替代Breeze，也不声称眼镜已经适配。</div>`),
 'device-note':()=>dialog('记录设备备注',`<form id="device-note-form">${field('设备型号','model','')}<label class="field"><span>待核实事项</span><textarea name="note" required rows="4" maxlength="2000" placeholder="记录固件、连接方式、故障现象等…"></textarea></label><button class="primary" type="submit">保存本地备注</button></form>`),
 'export-quote':()=>{download('报价草案-未签约.json',JSON.stringify({type:'报价草案',status:'访谈假设-未签约',...state.project,contribution:state.project.price-state.project.labor-state.project.models-state.project.other,exportedAt:new Date().toISOString()},null,2));log('导出本地报价草案');toast('报价草案已下载');},
 'export-draft':()=>{download('展览互动内容-草稿-未发布.json',JSON.stringify({type:'未发布本地草稿',version:version(),createdAt:new Date().toISOString(),project:state.project,authorization:{confirmedLocally:state.authorized},exhibits:exhibitData.map((e,i)=>({id:e.id,name:e.name,source:state.source[i],script:state.scripts[i]})),review:{name:state.reviewName,note:state.reviewNote,localOnly:true},tests:{status:'未执行真实测试',exampleLoaded:state.testsLoaded},audio:{generated:false},published:false,deviceAcceptance:'未验收',events:state.events},null,2));log('导出本地草稿（非完整交付包）');toast('草稿JSON已下载');},
 'issue':()=>dialog('记录未结问题',`<form id="issue-form">${field('问题标题','title','')}<label class="field"><span>问题及影响范围</span><textarea name="note" rows="4" required maxlength="2000"></textarea></label><button type="submit" class="primary">记录问题</button></form>`),
 'feedback-select':el=>{state.feedback=Number(el.dataset.value);state.candidate=false;render();},
 'candidate':()=>{state.candidate=true;log('登记'+feedbacks[state.feedback].id+'改进候选，回归未运行');addMessage('assistant','改进候选已本地登记。尚未执行脚本修订、真实回归或发布，不能标记为改进闭环完成。');render();toast('候选已登记（本地）');}
};
$('#workspace-body').addEventListener('input',ev=>{const el=ev.target,key=formKey(el);if(!key||el.type==='file')return;ui.drafts.set(ui.scope+':'+key,(el.type==='checkbox'||el.type==='radio')?el.checked:el.value);});
$('#workspace-body').addEventListener('scroll',()=>ui.scroll.set(state.view,$('#workspace-body').scrollTop),{passive:true});
$('#workspace-body').addEventListener('toggle',ev=>{const el=ev.target;if(el.matches('details[data-disclosure-key]')&&el.isConnected)ui.details.set(el.dataset.disclosureKey,el.open);},true);
$('#chat-width').addEventListener('change',ev=>document.documentElement.style.setProperty('--chat-width',ev.target.value+'%'));
$('#dialog').addEventListener('close',()=>{if(ui.returnFocus?.isConnected)ui.returnFocus.focus({preventScroll:true});});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#dialog').open&&ui.focused)setFocused(false);});
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el||el.disabled)return;const handler=handlers[el.dataset.action];if(handler)handler(el);});
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('tr[data-action]')){ev.preventDefault();handlers['test-select'](ev.target);}});
document.addEventListener('submit',ev=>{
 const f=ev.target;ev.preventDefault();
 if(f.id==='chat-form'){const input=$('#message');const text=input.value.trim();if(!text)return;addMessage('user',text);input.value='';let view=/报价|需求|范围|客户/.test(text)?'project':/语音|眼镜|音频|Breeze/i.test(text)?'voice':/测试|审核|回归/.test(text)?'tests':/发布|导出|交付/.test(text)?'release':/反馈|改进/.test(text)?'feedback':/来源|资料|脚本|讲解/.test(text)?'content':null;addMessage('assistant',view?'已为你切换到“'+views.find(v=>v[0]===view)[1]+'”。这是本地关键词导航演示，不是模型生成回答。你可以在右侧继续编辑与查看。':'已收到你的消息。当前是离线前端演示，我可以帮你导航到项目、来源脚本、测试审核、语音终端、发布或改进视图；真实AI尚未连接。');log('接收本地对话消息（未调用模型）');if(view)go(view);else render();}
 if(f.id==='project-form'){const d=new FormData(f);['customer','reviewer','audience','duration','scope'].forEach(k=>state.project[k]=String(d.get(k)||'').trim());if(!state.project.customer||!state.project.scope){toast('请填写客户与服务范围');return;}state.project.confirmed=true;log('保存本地项目范围');addMessage('assistant','项目范围已本地确认。报价仍是访谈假设，客户签约、眼镜验收和收款分别记录。');render();toast('项目范围已保存');}
 if(f.id==='cost-form'){const d=new FormData(f);const values=['price','labor','models','other'].map(k=>[k,Number(d.get(k))]);if(values.some(([,v])=>!Number.isFinite(v)||v<0)){toast('请输入非负有效金额');return;}values.forEach(([k,v])=>state.project[k]=v);log('更新假设成本测算');render();toast('假设测算已更新');}
 if(f.id==='review-form'){const d=new FormData(f);const name=String(d.get('reviewName')||'').trim();if(!name){toast('请先填写审核人');return;}state.reviewName=name;state.reviewNote=String(d.get('reviewNote')||'').trim();state.reviewConfirmed=d.has('reviewConfirmed');state.approved=state.reviewConfirmed;log('保存'+version()+'本地审校意见，未批准发布');addMessage('assistant','已保存'+version()+'的本地审校意见。真实测试、音频和正式批准仍未完成，发布继续锁定。');render();toast('审核意见已保存（非发布批准）');}
 if(f.id==='device-note-form'||f.id==='issue-form'){const d=new FormData(f);const label=f.id==='device-note-form'?'设备备注':'未结问题';const text=String(d.get('note')||'').trim();if(!text)return;log(label+'：'+text);$('#dialog').close();addMessage('assistant',label+'已保存在本次会话的事件记录中，不代表验收通过。');toast('本地记录已保存');render();}
});
document.addEventListener('change',async ev=>{const el=ev.target;if(el.id==='text-file'||el.id==='source-file'){await importText(el.files[0]);el.value='';}if(el.dataset.change==='authorization'){state.authorized=el.checked;log(state.authorized?'资料使用权本地确认':'撤销资料使用权确认');toast(state.authorized?'已记录本地授权确认':'已撤销授权确认');}if(el.id==='audio-file'){const file=el.files[0];if(!file)return;if(file.size>30*1024*1024){toast('音频不能超过30MB');return;}if(!/^audio\//.test(file.type)&&! /\.(mp3|wav|m4a|ogg)$/i.test(file.name)){toast('请选择有效音频文件');return;}if(state.audioUrl)URL.revokeObjectURL(state.audioUrl);state.audioUrl=URL.createObjectURL(file);state.audio={name:file.name,bytes:file.size};log('导入本地音频试播：'+file.name);render();const audio=document.querySelector('audio');if(audio)audio.addEventListener('error',()=>toast('浏览器无法播放该音频，请换用MP3或WAV'),{once:true});}});
$('#message').addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();$('#chat-form').requestSubmit();}});
window.addEventListener('hashchange',render);
window.addEventListener('beforeunload',()=>{if(state.audioUrl)URL.revokeObjectURL(state.audioUrl);});
addMessage('user','把这3个展项做成适合亲子观众的互动讲解，每项约45秒。先给我审核，再制作语音。');
addMessage('assistant','收到。我会先保留原文并建立出处，再生成讲解和追问。发现资料不足的地方会单独列出，不替你补写事实。');
addMessage('assistant','EX02 的传播速度缺少适用条件。这条候选内容已暂停，其他草稿可以先看。（示例任务，未调用真实AI）',[['source','查看待核实引用'],['nav-content','继续检查草稿']]);
render();
$('#chat-log').scrollTop=0;
})();
</script>
</body></html>

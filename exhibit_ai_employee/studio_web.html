<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>展览互动内容制作员 · 展项内容工作台</title><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/refinement.css"><link rel="stylesheet" href="assets/atelier.css"><link rel="stylesheet" href="assets/workspace-tools.css"><link rel="stylesheet" href="assets/studio.css"></head>
<body>
<header class="topbar"><a class="brand" href="#live" aria-label="回到执行现场"><span class="orbit"></span><strong>展览互动内容制作员</strong><span class="brand-en">EXHIBIT<br>AI EMPLOYEE</span></a><button class="project-switch" id="project-switch" data-action="project">正在读取项目… <span>⌄</span></button><div class="top-actions"><span class="demo-label is-wait" id="conn-chip"><i></i><span id="conn-text">正在连接本机服务…</span></span><button class="icon-btn light" data-action="help" aria-label="使用说明">?</button><span class="avatar" id="user-avatar">—</span><span class="user-name" id="user-name">本机操作者</span><button class="icon-btn light" data-action="settings" aria-label="工作区设置">⌄</button></div></header>
<div class="mobile-switch"><button data-action="mobile" data-value="chat">员工对话</button><button data-action="mobile" data-value="work" class="active">任务工作区</button></div>
<div class="app-shell">
<aside class="conversation" aria-label="数字员工对话">
<div class="employee-head"><span class="employee-mark"><span class="orbit"></span></span><div><h1>展览互动内容制作员</h1><p>负责整理、制作、校验与交付</p><span class="employee-state" id="employee-state"><i></i>正在连接服务</span></div></div>
<div class="context-chips" id="context-chips"></div>
<div id="chat-log" class="chat-log" role="log" aria-live="polite"></div>
<div class="composer-wrap"><div class="session-note"><span class="status-dot" id="session-dot"></span><span id="session-note">正在确认服务状态…</span></div><div id="attachment-preview" class="attachment-preview"></div><form id="chat-form" class="composer"><label class="sr-only" for="message">给数字员工发送消息</label><textarea id="message" rows="2" maxlength="4000" placeholder="补充资料，或告诉员工下一步怎么做…"></textarea><div class="composer-tools"><label class="attach-btn" title="导入资料文件：txt / md / csv / json / html / docx / pdf（写入项目资料来源）"><span>＋</span><input data-upload="material" type="file" accept=".txt,.md,.markdown,.csv,.tsv,.json,.html,.htm,.docx,.pdf" hidden></label><span>资料导入后即可被引用</span><button type="submit" class="send" aria-label="发送消息">↑</button></div></form><p class="composer-caption">消息发送到本机 studio_server，模型调用计入真实额度 · Shift + Enter 换行</p></div>
</aside>
<main class="workspace" aria-label="任务工作区"><nav id="workspace-tabs" class="workspace-tabs" aria-label="功能页面"></nav><div class="workspace-tools" aria-label="工作区布局工具"><div class="layout-tools"><button type="button" data-action="focus-work" aria-pressed="false">专注工作区</button><label class="width-control">对话宽度 <select id="chat-width" aria-label="对话栏宽度"><option value="28">28%</option><option value="33.3333" selected>33%</option><option value="38">38%</option></select></label></div><div class="disclosure-tools"><button type="button" data-action="expand-all">展开全部</button><button type="button" data-action="collapse-all">收起全部</button></div></div><div id="workspace-body" class="workspace-body"></div><footer class="work-footer"><span><span class="shield">✓</span> 原文保持不变 · 成果绑定内容版本</span><button class="text-button" data-action="events">查看事件记录 ↗</button></footer></main>
</div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="icon-btn" data-action="close-dialog" aria-label="关闭弹窗">×</button></div><div id="dialog-body"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><div style="padding:24px;font:14px/1.8 system-ui">这个工作台需要 JavaScript 才能读取本机后端数据。请启用脚本后刷新。</div></noscript>
<script src="assets/app.js"></script>
</body></html>
